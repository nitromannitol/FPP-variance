name: Comparators

# Judges each Audit/<Name>/Solution.lean against Audit/<Name>/Challenge.lean the
# way the registry does, with the `lake comparator` that ships in the project's
# own toolchain (through scripts/verify-comparators.sh): the Solution must prove
# theorems whose statements, with their whole dependency closures, are
# identical to the Mathlib-only Challenge's, using only the permitted axioms,
# and both Lean's kernel and the independent kernels bundled with the
# toolchain must accept it. One job per challenge, in parallel.
#
# This workflow does not build the library: it judges exactly the build that
# "Build and verify" checked, and keeps each runner's time and disk for the
# export and the replay. It starts when a "Build and verify" run on main has
# completed, and runs only if that run succeeded and was a push or a manual run;
# it then restores the build cache that run saved (`fail-on-cache-miss`). Pull
# requests are built and checked by "Build and verify", which saves no cache for
# them, so they are not judged here. A manual run restores the most recent build
# cache of the commit it runs on, so run "Build and verify" there first.
"on":
  workflow_run:
    workflows: ["Build and verify"]
    types: [completed]
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

# A run in progress is never cancelled: one comparator run takes hours and
# builds nothing that a later run could resume from.
concurrency:
  group: comparators-${{ github.event.workflow_run.head_branch || github.ref }}
  cancel-in-progress: false

jobs:
  comparators:
    name: Check ${{ matrix.comparator }}
    # After a build run: only if it succeeded, was a push to main or a manual
    # run of main, and ran on this repository's own commit.
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.head_repository.full_name == github.repository &&
      contains(fromJSON('["push", "workflow_dispatch"]'), github.event.workflow_run.event))
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        comparator: [LatticeVariance, IsotropicMetric, WhiteNoiseGeneral, PoissonGeneral]
    # GitHub's hard maximum for a hosted job.
    timeout-minutes: 360
    defaults:
      run:
        shell: bash
    steps:
      # The commit the build run built; the commit of the run itself when
      # started manually.
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}

      # The exported environments of the Challenge and the Solution, the build
      # artifacts, the toolchain, and the NanoDa replay need more disk than a
      # hosted runner has free at start; without this step the replay ends with
      # "no space left on device". Only remove preinstalled, unused SDKs on
      # disposable hosted runners, and fail at once if less than 30 GiB is
      # available.
      - name: Free runner disk space
        run: |
          set -Eeuo pipefail
          # Only remove preinstalled, unused SDKs on disposable hosted runners.
          if [[ "${RUNNER_ENVIRONMENT:-}" == github-hosted ]]; then
            sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
            sudo docker image prune --all --force > /dev/null || true
          fi
          df -h .
          available_kib="$(df -Pk . | awk 'NR==2 {print $4}')"
          test "$available_kib" -ge 31457280

      # The export and the NanoDa replay of a Solution can exceed the memory of
      # a 16 GB runner. A swap file turns an out-of-memory kill into a slow
      # step. It goes on /mnt, which has its own disk; without 28 GiB free there
      # it is skipped, never taken from the disk the comparator needs.
      - name: Add swap
        run: |
          set -Eeuo pipefail
          free_kib="$( (df -Pk /mnt 2>/dev/null || true) | awk 'NR==2 {print $4}')"
          free_kib="${free_kib:-0}"
          if [[ "${RUNNER_ENVIRONMENT:-}" == github-hosted && "$free_kib" -ge 29360128 ]]; then
            sudo fallocate -l 24G /mnt/ci-swap
            sudo chmod 600 /mnt/ci-swap
            sudo mkswap /mnt/ci-swap
            sudo swapon /mnt/ci-swap
          else
            echo "No swap file added (/mnt has $((free_kib / 1048576)) GiB free)."
          fi
          free -h

      - name: Check Lean source requirements
        run: python3 scripts/check-lean-sources.py

      # Install the toolchain from `lean-toolchain` and fetch the Mathlib cache.
      # The action's own cache is off; the build cache is restored below.
      - name: Set up Lean and Mathlib cache
        uses: leanprover/lean-action@38fbc41a8c28c4cbaec22d7f7de508ec2e7c0dd9 # v1.5.0
        with:
          build: false
          use-mathlib-cache: true
          use-github-cache: false

      # The exact entry that the "Build and verify" run saved: its commit, run
      # id and attempt. If the build run's save failed (for instance on the
      # cache quota), the most recent entry of the same commit is used; with
      # none at all the step fails, and so does this run, because a cold build
      # does not fit in this job. For a manual run the key never matches and the
      # most recent entry of the commit is used. This workflow saves no cache.
      - name: Restore the build run's artifacts
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .lake/build
          key: lake-build-${{ hashFiles('lean-toolchain', 'lake-manifest.json') }}-${{ github.event.workflow_run.head_sha || github.sha }}-${{ github.event.workflow_run.id || 'manual' }}-${{ github.event.workflow_run.run_attempt || '0' }}
          restore-keys: |
            lake-build-${{ hashFiles('lean-toolchain', 'lake-manifest.json') }}-${{ github.event.workflow_run.head_sha || github.sha }}-
          fail-on-cache-miss: true

      - name: Install bubblewrap for lake comparator's sandbox
        # Ubuntu 24.04 restricts unprivileged user namespaces through AppArmor,
        # which bwrap needs; the runner is disposable.
        run: |
          sudo apt-get update -qq >/dev/null
          sudo apt-get install -y -qq bubblewrap >/dev/null
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0

      # `lake comparator` finds the Challenge, the Solution and the library
      # built, exports both environments and replays the Solution through the
      # Lean kernel and the toolchain's independent kernels.
      - name: Run the toolchain's lake comparator
        timeout-minutes: 300
        run: ./scripts/verify-comparators.sh "${{ matrix.comparator }}"
