<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="370" viewBox="0 0 1000 370">
<rect width="1000" height="370" fill="white"/>
<g font-family="Arial, sans-serif" fill="#142332" font-size="17">
<text x="35" y="30">Crossing endpoints must also be widened</text>
<rect x="100" y="72" width="300" height="215" fill="#fff0d8" stroke="#ba7b29" stroke-width="2"/>
<rect x="100" y="115" width="300" height="125" fill="#dfedf9" stroke="#295c86" stroke-width="2"/>
<line x1="100" y1="72" x2="100" y2="287" stroke="#ba7b29" stroke-width="8"/>
<line x1="400" y1="72" x2="400" y2="287" stroke="#ba7b29" stroke-width="8"/>
<line x1="100" y1="115" x2="100" y2="240" stroke="#295c86" stroke-width="8"/>
<line x1="400" y1="115" x2="400" y2="240" stroke="#295c86" stroke-width="8"/>
<path d="M100 90 C170 155 260 150 400 267" fill="none" stroke="#893c36" stroke-width="3"/>
<text x="35" y="80">b + wW</text><text x="75" y="122">b</text><text x="75" y="245">a</text><text x="35" y="292">a − wW</text>
<text x="110" y="325" font-size="15">Blue: old interval. Gold: added endpoints.</text>
<text x="110" y="348" font-size="15">The drawn path has endpoints outside the old interval.</text>
<text x="535" y="30">Line bounds for a barrier core</text>
<rect x="605" y="88" width="300" height="186" fill="#f8dfdf" stroke="#a34747" stroke-width="2"/>
<g stroke="#295c86" stroke-width="2">
<line x1="580" x2="930" y1="71" y2="71"/><line x1="580" x2="930" y1="88" y2="88"/><line x1="580" x2="930" y1="105" y2="105"/>
<line x1="580" x2="930" y1="257" y2="257"/><line x1="580" x2="930" y1="274" y2="274"/><line x1="580" x2="930" y1="291" y2="291"/>
</g>
<text x="540" y="94">q⁺</text><text x="540" y="280">q⁻</text>
<text x="670" y="185">Barrier core</text>
<text x="590" y="325" font-size="15">Each end needs heights q − w/3, q, q + w/3.</text>
<text x="590" y="348" font-size="15">Triples with spacing w do not contain these lines.</text>
</g></svg>