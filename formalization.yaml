# yaml-language-server: $schema=https://raw.githubusercontent.com/mathlib-initiative/formalization.yaml/main/schema/formalization.schema.json
version: "v0.4"

project:
  name: "Fluctuation bounds for first-passage percolation"
  description: >-
    A Lean 4 / Mathlib formalization of two papers of S. Armstrong and A.
    Bou-Rabee on the fluctuations of passage times in first-passage
    percolation. "Curvature and variance in lattice first-passage percolation":
    for independent, identically distributed edge weights on Z^d, d >= 2, whose
    law nu has an exponential moment and nu({0}) below the critical probability
    of bond percolation (Assumption (W)), and for constants delta in (0, 1], r >
    0, Lambda >= 0 and lambda > 0, there are epsilon > 0 and C such that E
    exp(|T(0, x) - mu(x)| / (C |x|^((1 - epsilon)/2))) <= 2 for every unit
    vector xi in R^d, rational or not, at which the time constant mu has a
    quadratic expansion on the orthogonal hyperplane with these constants
    (Assumption (Curv): a linear term, a quadratic form at least lambda |h|^2,
    and a remainder at most Lambda |h|^(2 + delta) for |h| <= r), and every x in
    Z^d other than 0 within distance |x|^(3/4) of the ray through xi; epsilon
    and C do not depend on the direction (Theorem 1.1). The repository also
    proves the variance bound that follows, Var T(0, x) <= 2 C^2 |x|^(1 -
    epsilon), and Var T(0, floor(n xi)) <= n^(1 - epsilon) for every
    sufficiently large integer n, uniformly in the direction, the floor taken
    coordinatewise. "Fluctuation bounds for
    rotationally invariant first-passage percolation": for the random density
    psi(chi * W) of Gaussian white noise W on R^d, d >= 2, with chi smooth,
    radial and supported in the closed unit ball and psi continuous with values
    between two positive constants, the passage time T over rectifiable curves
    has a time constant mu = lim t^(-1) E T(0, t e_1), and there are epsilon > 0
    and C such that E exp(|T(0, x) - mu |x|| / (C |x|^((1 - epsilon)/2))) <= 2
    for every point x with |x| >= 1 (Theorem 1.1); the same holds for every
    density of white noise or of a homogeneous Poisson process that is jointly
    measurable, determined by the noise in the closed unit ball around each
    point, bounded between two positive constants and equivariant under
    rotations and translations (Assumption A, Theorem 1.2). The repository also
    proves the variance bounds that follow, Var T(0, t e_1) <= t^(1 - epsilon)
    for every sufficiently large t and Var T(0, x) <= |x|^(1 - epsilon) for
    every point x with |x| sufficiently large. Every result of the literature
    that the proofs cite is stated and proved in the repository.
  authors:
    - "Scott Armstrong"
    - "Ahmed Bou-Rabee"
  responsible_maintainers:
    - "Scott Armstrong"
    - "Ahmed Bou-Rabee"
  affiliations:
    - "Scott Armstrong: CNRS & Laboratoire Jacques-Louis Lions, Sorbonne Université and Courant Institute of Mathematical Sciences, New York University"
    - "Ahmed Bou-Rabee: Department of Mathematics, University of Pennsylvania"
  license: "Apache-2.0"
  funding:
    - "Scott Armstrong was supported by the European Research Council (ERC) under the European Union's Horizon Europe research and innovation programme, grant agreement No. 101200828."

classification:
  arxiv: ["math.PR"]
  msc2020: ["60K35", "82B43", "60K37"]

sources:
  - title: "Curvature and variance in lattice first-passage percolation"
    authors:
      - "Scott Armstrong"
      - "Ahmed Bou-Rabee"
    type: "article"
    location: "papers/CurvatureVariance.pdf (the version of October 31, 2026; 18 pages): Theorem 1.1, and every result of the literature its proof cites"
    relationship: "formalizes"
    note: >-
      Theorem 1.1 is formalized with the paper's hypotheses
      (lintegral_exp_passageTime_le): for the constants delta, r, Lambda and
      lambda of (Curv) (AssumptionCWith, with M for Lambda and c for lambda) there
      are epsilon and C, and then the exponential-moment bound holds at every unit
      vector xi at which (Curv) holds with these constants and at every nonzero
      lattice point x such that some point beta xi with beta >= 0 lies within
      distance |x|^(3/4) of x; the hypotheses are (W) and (Curv) and nothing else.
      The constant C is a positive real number; the expectation of the exponential
      is a Lebesgue integral with values in [0, infinity], so that the bound also
      asserts that it is finite; and the theorem also concludes that the passage
      time is a random variable (almost everywhere measurable). The variance bound
      stated after Theorem 1.1 is proved with the same epsilon and C, and so is
      its corollary at the lattice points floor(n xi), the floor taken
      coordinatewise: Var T(0, floor(n xi)) <= n^(1 - epsilon) for n >= n_0, with
      epsilon and n_0 chosen before the unit vector xi
      (evariance_passageTime_floorVertex_le_uniform). The repository also proves
      a statement that the paper does not make and that is not a corollary of
      Theorem 1.1: the same bound at one nonzero xi, under an expansion of the
      time constant on a complementary hyperplane H with constants of its own
      (AssumptionCAt), with epsilon and n_0 depending on the direction
      (evariance_passageTime_floorVertex_le). The lattice is Z^d = Z x
      Z^m with d = m + 1; this product is only an indexing of the coordinates, and
      no coordinate is distinguished in the statements. The vector e_1 appears
      only in three cited results, [ADH, Theorems 2.1, 2.5 and 2.6], which are
      stated at e_1 as their source states them. The weights are a configuration
      law P under which the edge weights are independent with law F, the paper's
      nu (IsIIDWeights); the time constant is a norm mu on R^d with T(0, nx)/n ->
      mu(x) almost surely for every x in Z^d (IsTimeConstant). Both notions are
      proved to exist under (W) and to be unique, so quantifying over them is the
      paper's statement. The variance is Mathlib's extended variance evariance,
      with values in [0, infinity], so that a variance bound also asserts that the
      variance is finite. The critical probability is p_c(d) = sup {p : theta(p) =
      0} for bond percolation. The results the proof uses from [ADH], [BR], [BLM]
      and [AKM], directly or through the continuum paper, Kesten's bound on paths
      of small passage time [Kes86, Proposition 5.8], stated under (W) as the paper
      uses it, and the sharpness of the phase transition [DCT, Theorem 1.1], by
      which p_T(d) = p_c(d) and Kesten's bound holds under (W), are stated as the
      paper uses them and proved. Every deviation of the Lean
      statements from the printed ones, and every difference of route between the
      formal and the printed proofs, is listed in docs/FORMALIZATION-NOTES.md.
    license: "© the authors, all rights reserved; included as papers/CurvatureVariance.pdf for reference, not covered by the Apache-2.0 license of the code"
    author_endorsement: "participated"
  - title: "Fluctuation bounds for rotationally invariant first-passage percolation"
    authors:
      - "Scott Armstrong"
      - "Ahmed Bou-Rabee"
    type: "article"
    location: "papers/IsotropicVariance.pdf (the version submitted to arXiv on October 30, 2026; 19 pages): Theorem 1.1, Theorem 1.2 for white noise and for the Poisson process, and every result of the literature their proofs cite"
    relationship: "formalizes"
    note: >-
      Theorems 1.1 and 1.2 are formalized with the paper's hypotheses, on a
      standard Borel probability space carrying the noise
      (lintegral_exp_passageTime_le, and its two forms for Theorem 1.2, one for
      each noise). Assumption A is formalized as printed (IsLocalDensity): the
      value of the density at x is determined by the restriction of the noise to
      the closed unit ball around x, and the density is equivariant under the
      proper rigid motions, the compositions of a rotation and a translation.
      White noise is a measurable random distribution whose value at every test
      function is a centered Gaussian with variance the squared L^2 norm of the
      test function; the Poisson process of intensity lam > 0 is a measurable
      random locally finite counting measure with independent Poisson counts on
      disjoint bounded Borel sets. The passage time is the infimum of the cost
      over rectifiable curves. Each main theorem asserts that the time constant
      mu = lim t^(-1) E T(0, t e_1) exists and bounds the exponential moment with
      this mu; the constant C is a positive real number; the expectation of the
      exponential is a Lebesgue integral with values in [0, infinity], so that
      the bound also asserts that it is finite; and the theorem also concludes
      that the passage time is a random variable (almost everywhere measurable).
      The repository also proves the variance bounds that follow from Theorems
      1.1 and 1.2, Var T(0, t e_1) <= t^(1 - epsilon) for large t and Var T(0, x)
      <= |x|^(1 - epsilon) for large |x|, with epsilon and the threshold chosen
      before the point (variance_passageTime_le, variance_passageTime_le_norm and
      their forms for Theorem 1.2), for Mathlib's extended variance. The results
      the proofs cite from [AKM], [BLM], [HN] and [BR] are stated as the paper
      uses them and proved. Every deviation of the Lean statements from the
      printed ones, and every difference of route between the formal and the
      printed proofs, is listed in docs/FORMALIZATION-NOTES.md.
    license: "© the authors, all rights reserved; included as papers/IsotropicVariance.pdf for reference, not covered by the Apache-2.0 license of the code"
    author_endorsement: "participated"
  - title: "Rotationally invariant first passage percolation: Concentration and scaling relations"
    authors:
      - "Riddhipratim Basu"
      - "Vladas Sidoravicius"
      - "Allan Sly"
    type: "article"
    id: "arXiv:2312.14143"
    location: "https://arxiv.org/abs/2312.14143"
    relationship: "background"
    note: >-
      Earlier work of Basu, Sidoravicius and Sly on rotationally invariant
      first-passage percolation. Not formalized here; neither paper uses a
      result of it as an input.
    license: "unknown"
  - title: "Rotationally invariant first passage percolation: Breaking the n/log n variance barrier"
    authors:
      - "Riddhipratim Basu"
      - "Vladas Sidoravicius"
      - "Allan Sly"
    type: "article"
    id: "arXiv:2604.01214"
    location: "https://arxiv.org/abs/2604.01214"
    relationship: "background"
    note: >-
      Cited by both papers. The continuum paper uses its framework of slabs
      whose passage times are computed from independent noise. Not formalized
      here; neither paper uses a result of it as an input.
    license: "unknown"

