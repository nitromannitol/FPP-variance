status:
  scope: >-
    Complete for the main results of both papers. The main theorems, the
    exponential-moment bounds of Theorem 1.1 of the lattice paper and of Theorems
    1.1 and 1.2 of the continuum paper (for white noise and for the Poisson
    process), are proved from the papers' hypotheses alone, together with the
    variance bounds that follow from them: for the lattice paper, the bound
    stated after Theorem 1.1 and the bound at the points floor(n xi), uniformly
    in the direction; for the continuum paper, the bounds at the points t e_1
    and at every point x with |x| large. For the lattice, the repository also
    proves the bound at the points floor(n xi) at one direction, under a
    hypothesis of its own that the paper does not state. Every result of the
    literature that the proofs use has its own statement and proof in the
    repository (15 statements for the lattice paper, among them the sharpness of
    the phase transition behind Kesten's bound, and 8 for the continuum paper),
    and the notions the main theorems use (independent weights, the time
    constant, white noise, the Poisson process) are proved to exist. Each main
    theorem is restated with Mathlib alone in a comparator challenge under
    Audit/.
