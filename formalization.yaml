automation:
  methods:
    - method: "agent"
      models:
        - "claude-opus-5-5"
        - "gpt-6.1-sol"
      framework: >-
        Claude Code (Claude Opus 5.5) and Codex (GPT-6.1 Sol), directed by
        the authors.
      tool_setup: >-
        Lean 4 and Mathlib v4.35.0-rc2 (commit
        065356127b1dc0016f66b7283ce0ce2c4055aa55). The exact Lean statements of the main
        theorems, of the cited results and of the definitions they use were
        written first, checked against the papers and their sources by an
        agent that did not write them, and kept fixed while their proofs were
        developed; each completed proof of such a statement received a
        separate check. Verification uses full builds, axiom checks, and the
        Mathlib-only comparator challenges with Lean's comparator and the
        independent kernel checkers bundled with the toolchain.
      cost:
        wall_time: "about six days of Lean development for these libraries (2026-10-26 to 2026-10-31), reusing supporting Lean code from the authors' earlier unpublished formalization work on related arguments"
        spend_usd: "not separately tracked (subscription-based usage)"
        hardware: "one shared 16-core / 124 GB RAM Linux machine"
      prompting_notes: >-
        The authors provided the papers and directed the development. Claude
        Opus 5.5 coordinated the work; the Lean code was written by Claude
        Opus 5.5 and GPT-6.1 Sol agents.
  spend_usd: "not separately tracked (subscription-based usage)"
  notes: >-
    All Lean code was written by the listed models under the direction of the
    authors. Every proof is checked by the Lean kernel; the libraries contain
    no sorry and no custom axiom. The comparator challenges in Audit/ each
    contain one intentional statement-level sorry per theorem, filled by the
    corresponding solution.

fidelity:
  divergences: >-
    Lattice paper: Theorem 1.1 has exactly the hypotheses (W) and (Curv), with
    the constants of (Curv) quantified before epsilon and C, and the unit
    direction and the point after them, as in the paper; the Lean writes M and c
    for the paper's Lambda and lambda; "within distance |x|^(3/4) of the ray" is
    the existence of a point beta xi with beta >= 0 at that distance from x,
    which is the same condition since the ray is closed; the constant C is a
    positive real number; the expectation of the exponential is a Lebesgue
    integral with values in [0, infinity]; the theorem also concludes that the
    passage time is almost everywhere measurable; the independent weights and
    the time constant enter as predicates on the law of the configuration and on
    a norm, both proved to exist and to be unique; the variance bounds that
    follow are also proved, for the extended variance. Continuum paper: the
    noise lives on a standard Borel probability space; Theorem 1.2 is stated as
    two theorems, one for each noise; the time constant enters by its defining
    limit, which each main theorem asserts to exist; the constant C is a positive
    real number; the expectation of the exponential is a Lebesgue integral with
    values in [0, infinity]; the main theorems also conclude that the passage
    time is almost everywhere measurable; the variance bounds that follow are
    also proved, at the points t e_1 and at every point x with |x| large. Cited
    results are formalized in the form the papers use, some specialized to the
    papers' hypotheses, and some with explicit constants where the source
    computes an optimal one that the papers do not use. Every divergence, and
    every difference of route between the formal and the printed proofs, is
    listed in docs/FORMALIZATION-NOTES.md.

review:
  status: "author-approved-statements"
  reviewers:
    - "Scott Armstrong"
  notes: >-
    Lean checks each proof against its formal statement. The statements of
    the main theorems, of the cited results and of the definitions they use
    were checked against the papers and the cited sources by agents that did
    not write them, and approved by the authors; the comparator declarations
    are checked mechanically. This is not external peer review.

alignment:
  namespace: "CurvatureVariance, IsotropicVariance"
  statements:
    - source: "Curvature and variance in lattice first-passage percolation, Theorem 1.1"
      lean: "CurvatureVariance.lintegral_exp_passageTime_le"
      module: "CurvatureVariance.Statements.Main.LintegralExpPassageTimeLe"
      status: "proved"
      note: "Assumption (W); for the constants delta, r, Lambda, lambda of (Curv) there are epsilon and C with E exp(|T(0, x) - mu(x)| / (C |x|^((1 - epsilon)/2))) <= 2 at every unit vector xi satisfying (Curv) with these constants and every nonzero x in Z^d within distance |x|^(3/4) of the ray through xi."
    - source: "Curvature and variance in lattice first-passage percolation, Assumption (Curv) with the constants delta, r, Lambda, lambda"
      lean: "CurvatureVariance.AssumptionCWith"
      module: "CurvatureVariance.Statements.Curvature.AssumptionCWith"
      status: "defined"
      note: "On the orthogonal hyperplane (span {xi})ᗮ: a linear functional and a quadratic form q with q h >= c |h|^2 (c is the paper's lambda), and |mu(xi + h) - mu(xi) - l(h) - q(h)| <= M |h|^(2 + delta) for |h| <= r (M is the paper's Lambda)."
    - source: "Curvature and variance in lattice first-passage percolation, the variance bound after Theorem 1.1"
      lean: "CurvatureVariance.Paper.Closing.variance_passageTime_le"
      module: "CurvatureVariance.Paper.Closing.Main"
      status: "proved"
      note: "The conclusion of Theorem 1.1 together with Var T(0, x) <= 2 C^2 |x|^(1 - epsilon), for the same epsilon and C."
    - source: "Curvature and variance in lattice first-passage percolation, the variance bound at the points floor(n xi), uniform in the direction"
      lean: "CurvatureVariance.evariance_passageTime_floorVertex_le_uniform"
      module: "CurvatureVariance.Statements.Main.EvariancePassageTimeFloorVertexLeUniform"
      status: "proved"
      note: "Assumption (W); for the constants delta, r, Lambda, lambda of (Curv) there are epsilon and n_0 with Var T(0, floor(n xi)) <= n^(1 - epsilon) for n >= n_0 at every unit vector xi satisfying (Curv) with these constants; a consequence of the variance bound after Theorem 1.1."
    - source: "Not in the paper: a result of the formalization, at one direction of the lattice paper's setting; not a corollary of Theorem 1.1"
      lean: "CurvatureVariance.evariance_passageTime_floorVertex_le"
